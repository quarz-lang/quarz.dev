base_url = "https://quarz.dev"
title = "Quarz"
description = "A programming language that feels like Ruby, built on static typing, immutability and concurrency."
default_language = "en"
compile_sass = false
build_search_index = false
generate_feeds = false
# The imported docs are Markdown only: `{{ }}` in them is Quarz or Crystal,
# not a shortcode.
skip_content_templating = ["docs/*.md"]

[markdown]
insert_anchor_links = "left"
smart_punctuation = false

[markdown.highlighting]
error_on_missing_language = true
style = "class"
light_theme = "github-light"
dark_theme = "github-dark"
# The grammar lives in the language's repository; the build checks it
# out into quarz/ (see README.md).
extra_grammars = ["quarz/editors/textmate/quarz.tmLanguage.json"]

[link_checker]
internal_level = "error"

[slugify]
paths = "on"
taxonomies = "on"
# For the site's own pages: the imported docs' headings carry the anchors
# GitHub gives them (`{#1-字句}`, scripts/docs.qz).
anchors = "on"

[extra]
github = "https://github.com/quarz-lang/quarz"

[translations]
description = "A programming language that feels like Ruby, built on static typing, immutability and concurrency."
