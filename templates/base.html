<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ config.title }}{% endblock title %}</title>
  <meta name="description" content="{% block description %}{{ config.description }}{% endblock description %}">
  <link rel="stylesheet" href="{{ get_url(path='style.css', cachebust=true) }}">
  <link rel="stylesheet" href="{{ get_url(path='giallo-light.css', cachebust=true) }}" media="(prefers-color-scheme: light)">
  <link rel="stylesheet" href="{{ get_url(path='giallo-dark.css', cachebust=true) }}" media="(prefers-color-scheme: dark)">
</head>
<body>
  <header class="site">
    <nav>
      <a class="brand" href="/">Quarz</a>
      <a href="/install/">Install</a>
      <a href="/guide/">Guide</a>
      <a href="https://api.quarz.dev/">API</a>
      <a href="{{ config.extra.github }}">GitHub</a>
    </nav>
  </header>
  <main>
    {%- block content %}{% endblock content %}
  </main>
  <footer class="site">
    <p>Quarz · <a href="{{ config.extra.github }}">github.com/quarz-lang/quarz</a></p>
  </footer>
</body>
</html>
