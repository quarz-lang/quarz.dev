# Build quarz.dev and publish it to GitHub Pages: on every push to main,
# once a week (to check the Guide's examples against quarz's main, so a
# change to the language that leaves them behind is noticed) and by hand
# (deploying from main only). The standard library's API reference is
# published by quarz itself, at https://api.quarz.dev/. Pull requests,
# and runs started by hand on other branches, only build, which checks
# the internal links and the headings they point at (`zola build` fails
# on a broken one) and the examples.
name: Site

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time: a deployment in progress finishes, and the
# newest run waits for it (the ones in between are skipped).
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  # The quarz commit the site is built from: its TextMate grammar, and
  # the `quarz` that runs the Guide's examples.
  QUARZ_REF: main
  ZOLA_VERSION: v0.23.6
  # The sha256 GitHub lists for the release's x86_64-unknown-linux-gnu asset.
  ZOLA_SHA256: 8f5132b3522412d04e395e0b25f6d68613ad272a873e54a2b3ebf664873024a4

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: quarz-lang/quarz
          ref: ${{ env.QUARZ_REF }}
          path: quarz
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: quarz
      - name: Build quarz
        run: cargo build --release --bin quarz --manifest-path quarz/Cargo.toml
      # The Guide's code blocks are programs: a change to the language
      # that leaves them behind fails this step, weekly too.
      - name: Check the Guide's examples
        run: quarz/target/release/quarz run scripts/check_guide.qz quarz/target/release/quarz
      - name: Install Zola
        run: |
          mkdir -p "$RUNNER_TEMP/zola"
          curl -sSfL -o "$RUNNER_TEMP/zola.tar.gz" \
            "https://github.com/getzola/zola/releases/download/$ZOLA_VERSION/zola-$ZOLA_VERSION-x86_64-unknown-linux-gnu.tar.gz"
          echo "$ZOLA_SHA256  $RUNNER_TEMP/zola.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/zola.tar.gz" -C "$RUNNER_TEMP/zola"
          echo "$RUNNER_TEMP/zola" >> "$GITHUB_PATH"
      - name: Build the site
        run: zola build
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
